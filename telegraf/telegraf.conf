[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = "telegraf"

# INPUT — écoute les topics MQTT
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensors/#"]
  data_format = "json"
  json_string_fields = ["device_id", "location"]
  tag_keys = ["device_id", "location"]

# OUTPUT — expose les métriques au format Prometheus
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
